[project]
name = "potato-agent"
version = "0.1.0"
description = "A fully agentic voice LLM that runs smoothly on a laptop with no GPU."
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python>=0.3.0",
    "faster-whisper>=1.0.0",
    "piper-tts>=1.2.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "ddgs>=0.9.0",
    "webrtcvad>=2.0.10",
]

[project.scripts]
potato-agent = "potato_agent.voice_loop:main"
potato-agent-text = "potato_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"
