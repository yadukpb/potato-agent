name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      # Pure-logic suite only (see README's "Project status") -- no model
      # download or mic needed, so this runs on every push/PR without
      # fetching the ~2.5GB of GGUF/ONNX models.
      - name: Test
        run: pytest -q
